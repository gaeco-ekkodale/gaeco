# =============================================================================
# InstanceService — instance store + graph (ArcadeDB/Gremlin) (+ MFE client)
# -----------------------------------------------------------------------------
# instance-server calls access-server/usecase-server by service name -> therefore
# it sits (like those) on gaeco-network. Postgres + ArcadeDB stay internal.
# =============================================================================
services:
  instance-postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${INSTANCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${INSTANCE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${INSTANCE_POSTGRES_DATABASE}
    ports:
      - "${INSTANCE_POSTGRES_PORT}:5432"
    volumes:
      - type: bind
        source: ${VOLUME_BASE_PATH}/instance/postgres/
        target: /var/lib/postgresql/data
    networks:
      - instance-internal
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-d", "${INSTANCE_POSTGRES_DATABASE}", "-U", "${INSTANCE_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 30s

  instance-arcadedb:
    image: arcadedata/arcadedb:26.3.1
    user: "0:0"
    ports:
      - "${INSTANCE_ARCADEDB_HTTP_PORT}:2480"
      - "${INSTANCE_ARCADEDB_BINARY_PORT}:2424"
      - "${INSTANCE_ARCADEDB_GREMLIN_PORT}:8182"
    environment:
      - "JAVA_OPTS=-Darcadedb.server.rootPassword=${INSTANCE_ARCADEDB_PASSWORD} -Darcadedb.server.plugins=GremlinServer:com.arcadedb.server.gremlin.GremlinServerPlugin -Darcadedb.server.defaultDatabases=${INSTANCE_ARCADEDB_DATABASE}[${INSTANCE_ARCADEDB_USER}:${INSTANCE_ARCADEDB_PASSWORD}:admin]"
    volumes:
      - type: bind
        source: ${VOLUME_BASE_PATH}/instance/arcadedb/databases
        target: /home/arcadedb/databases
    networks:
      - instance-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 50

  instance-server:
    image: ${IMAGE_REGISTRY}/instance-server:${INSTANCE_SERVER_TAG}
    ports:
      - "${INSTANCE_SERVER_PORT}:80"
    depends_on:
      instance-arcadedb:
        condition: service_healthy
      instance-postgres:
        condition: service_healthy
      # Waits for Keycloak (JWT validation / JWKS at startup).
      keycloak-server:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Gremlin__Hostname=instance-arcadedb
      - Gremlin__Port=8182
      - Gremlin__Database=${INSTANCE_ARCADEDB_DATABASE}
      - Gremlin__User=${INSTANCE_ARCADEDB_USER}
      - Gremlin__Password=${INSTANCE_ARCADEDB_PASSWORD}
      - Gremlin__EnableSSL=false
      - Access__Address=http://access-server:80
      - UseCase__Address=http://usecase-server:80
      - Postgres__Host=instance-postgres
      - Postgres__Port=5432
      - Postgres__User=${INSTANCE_POSTGRES_USER}
      - Postgres__Password=${INSTANCE_POSTGRES_PASSWORD}
      - Postgres__Database=${INSTANCE_POSTGRES_DATABASE}
      - Kafka__Address=${KAFKA_ADDRESS}
      - Kafka__AutoOffsetReset=${KAFKA_AUTO_OFFSET_RESET}
      - Kafka__SessionTimeoutMs=${KAFKA_SESSION_TIMEOUT_MS}
      - Kafka__MaxPollIntervalMs=${KAFKA_MAX_POLL_INTERVAL_MS}
      - Kafka__MessageMaxBytes=${KAFKA_MESSAGE_MAX_BYTES}
      - Kafka__Consumers__GraphDataModel__ConsumerGroup=${KAFKA_CONSUMER_GROUP_INSTANCE}
      - Kafka__Consumers__GraphDataModel__TopicPattern=${KAFKA_TOPIC_PATTERN}
      - Kafka__Consumers__Guidelines__ConsumerGroup=${GUIDELINES_KAFKA_CONSUMER_GROUP}
      - Kafka__Consumers__Guidelines__Topic=${GUIDELINES_KAFKA_TOPIC}
      - Kafka__Consumers__Ontology__ConsumerGroup=${ONTOLOGY_KAFKA_CONSUMER_GROUP}
      - Kafka__Consumers__Ontology__Topic=${ONTOLOGY_KAFKA_TOPIC}
      - Minio__Address=${MINIO_ADDRESS}
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - Keycloak__ServerUrl=${KEYCLOAK_BACKEND_URL}
      - Keycloak__Realm=${KEYCLOAK_REALM}
      - Keycloak__ClientId=${KEYCLOAK_INSTANCE_CLIENT_ID}
      - Keycloak__ClientSecret=${KEYCLOAK_INSTANCE_CLIENT_SECRET}
      - Keycloak__Authority=${KEYCLOAK_BROWSER_URL}/realms/${KEYCLOAK_REALM}
      - OpenTelemetry__OtlpEndpoint=${OTLP_ENDPOINT}
    networks:
      - instance-internal
      - gaeco-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/80 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 50

  instance-client:
    image: ${IMAGE_REGISTRY}/instance-client:${INSTANCE_CLIENT_TAG}
    ports:
      - "${INSTANCE_CLIENT_PORT}:80"
    environment:
      VITE_INSTANCE_SERVER_URL: http://localhost:${INSTANCE_SERVER_PORT}
      VITE_USECASE_SERVER_URL: http://localhost:${USECASE_SERVER_PORT}
      VITE_ONTOLOGY_SERVER_URL: http://localhost:${ONTOLOGY_SERVER_PORT}
      VITE_ACCESS_SERVER_URL: http://localhost:${ACCESS_SERVER_PORT}
      VITE_GUIDELINE_SERVER_URL: http://localhost:${GUIDELINE_SERVER_PORT}
      VITE_MOUNT_PATH: ${INSTANCE_MOUNT_ROUTE}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_INSTANCE_CLIENT_ID}
    depends_on:
      instance-server:
        condition: service_healthy
    networks:
      - gaeco-network
    labels:
      app.mfe.id: "app-instance"
      app.mfe.displayName: "Instances"
      app.mfe.description: "Instance Client Application"
      app.mfe.iconPath: "/Instance.svg"
      app.mfe.entrypointPath: "/assets/remoteEntry.js"
      app.mfe.exposedModule: "App"
      app.mfe.route: "${INSTANCE_MOUNT_ROUTE}"

networks:
  instance-internal:
  gaeco-network:
    name: gaeco-local
