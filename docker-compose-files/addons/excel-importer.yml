# =============================================================================
# ADD-ON: ExcelImporter — imports tabular/Excel data into the platform
# =============================================================================
services:
  excel-import:
    image: ${IMAGE_REGISTRY}/excelimport:${EXCELIMPORT_SERVER_TAG}
    ports:
      - "${EXCELIMPORT_SERVER_PORT}:80"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Kafka__Address: ${KAFKA_ADDRESS}
      Kafka__Topic: ${KAFKA_TOPIC_EXCEL}
      OpenTelemetry__OtlpEndpoint: ${OTLP_ENDPOINT}
    networks:
      - gaeco-network

networks:
  gaeco-network:
    name: gaeco-local
