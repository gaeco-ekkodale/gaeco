# =============================================================================
# UseCaseService — use cases / business process definitions (+ MFE client)
# -----------------------------------------------------------------------------
# Corresponds to the original docker-compose.yml + docker-compose-override.yml,
# without Traefik. Bind mounts are centrally located under ${VOLUME_BASE_PATH}.
# =============================================================================
services:
  usecase-postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: ${USECASE_POSTGRES_PASSWORD}
      POSTGRES_USER: ${USECASE_POSTGRES_USER}
      POSTGRES_DB: ${USECASE_POSTGRES_DB}
    ports:
      - "${USECASE_POSTGRES_PORT}:5432"
    volumes:
      - type: bind
        source: ${VOLUME_BASE_PATH}/usecase/postgres/
        target: /var/lib/postgresql/data
    networks:
      - usecase-internal
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-d", "${USECASE_POSTGRES_DB}", "-U", "${USECASE_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 30s

  usecase-server:
    image: ${IMAGE_REGISTRY}/usecase-server:${USECASE_SERVER_TAG}
    ports:
      - "${USECASE_SERVER_PORT}:80"
    environment:
      Keycloak__ServerUrl: ${KEYCLOAK_BACKEND_URL}
      Keycloak__Realm: ${KEYCLOAK_REALM}
      Keycloak__Authority: ${KEYCLOAK_BROWSER_URL}/realms/${KEYCLOAK_REALM}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Database__Host: usecase-postgres
      Database__Port: 5432
      Database__Name: ${USECASE_POSTGRES_DB}
      Database__User: ${USECASE_POSTGRES_USER}
      Database__Password: ${USECASE_POSTGRES_PASSWORD}
      Kafka__Address: ${KAFKA_ADDRESS}
      Kafka__AutoOffsetReset: ${KAFKA_AUTO_OFFSET_RESET}
      Kafka__SessionTimeoutMs: ${KAFKA_SESSION_TIMEOUT_MS}
      Kafka__MaxPollIntervalMs: ${KAFKA_MAX_POLL_INTERVAL_MS}
      Kafka__Topics__UseCase: ${KAFKA_TOPICS_USECASE}
      OpenTelemetry__OtlpEndpoint: ${OTLP_ENDPOINT}
    networks:
      - usecase-internal
      - gaeco-network
    depends_on:
      usecase-postgres:
        condition: service_healthy
      # Waits for Keycloak (JWT validation / JWKS at startup).
      keycloak-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/80 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 50

  usecase-client:
    image: ${IMAGE_REGISTRY}/usecase-client:${USECASE_CLIENT_TAG}
    ports:
      - "${USECASE_CLIENT_PORT}:80"
    environment:
      VITE_API_URL: http://localhost:${USECASE_SERVER_PORT}
      VITE_MOUNT_PATH: ${USECASE_MOUNT_ROUTE}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_USECASE_CLIENT_ID}
    depends_on:
      usecase-server:
        condition: service_healthy
    networks:
      - gaeco-network
    labels:
      # Read by the App Orchestrator to register the Microfrontend in the Plugin Host.
      app.mfe.id: "app-usecase"
      app.mfe.displayName: "UseCases"
      app.mfe.description: "UseCase Client Application"
      app.mfe.iconPath: "/Usecase.svg"
      app.mfe.entrypointPath: "/assets/remoteEntry.js"
      app.mfe.exposedModule: "App"
      app.mfe.route: "${USECASE_MOUNT_ROUTE}"

networks:
  # Internal isolation of the database (only the server can reach it).
  usecase-internal:
  # Shared service network — all services reach each other here by service name.
  gaeco-network:
    name: gaeco-local
