# =============================================================================
# PluginHost — React shell that hosts all Microfrontends via Module Federation
# -----------------------------------------------------------------------------
# Starts LAST: the other clients register themselves into it.
# pluginhost-client on port ${PLUGINHOST_CLIENT_PORT} is the main entry point.
# =============================================================================
services:
  pluginhost-postgres:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${PLUGINHOST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PLUGINHOST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PLUGINHOST_POSTGRES_DATABASE}
    ports:
      - "${PLUGINHOST_POSTGRES_PORT}:5432"
    volumes:
      - type: bind
        source: ${VOLUME_BASE_PATH}/pluginhost/postgres/
        target: /var/lib/postgresql/data
    networks:
      - pluginhost-internal
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-d", "${PLUGINHOST_POSTGRES_DATABASE}", "-U", "${PLUGINHOST_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 30s

  pluginhost-server:
    image: ${IMAGE_REGISTRY}/pluginhost-server:${PLUGINHOST_SERVER_TAG}
    ports:
      - "${PLUGINHOST_SERVER_PORT}:80"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      PluginJwt__Issuer: http://localhost:${PLUGINHOST_SERVER_PORT}
      PluginJwt__Secret: ${PLUGINHOST_SERVER_GETPLUGIN_SECRET}
      Keycloak__Host: ${KEYCLOAK_BACKEND_URL}
      Keycloak__Realm: ${KEYCLOAK_REALM}
      Keycloak__ClientId: ${KEYCLOAK_PLUGINHOST_SERVER_CLIENT_ID}
      Keycloak__ClientSecret: ${KEYCLOAK_PLUGINHOST_SERVER_CLIENT_SECRET}
      SignalRMessaging__PluginEvent: PluginChange
      SignalRMessaging__Operation__AddPlugin: Add
      SignalRMessaging__Operation__DeletePlugin: Delete
      SignalRMessaging__Operation__PatchPlugins: Patch
      Postgres__Host: pluginhost-postgres
      Postgres__Port: 5432
      Postgres__Database: ${PLUGINHOST_POSTGRES_DATABASE}
      Postgres__User: ${PLUGINHOST_POSTGRES_USER}
      Postgres__Password: ${PLUGINHOST_POSTGRES_PASSWORD}
      SnapshotApiKey__HeaderName: X-API-Key
      SnapshotApiKey__ApiKey: ${PLUGINHOST_SNAPSHOT_API_KEY}
    depends_on:
      pluginhost-postgres:
        condition: service_healthy
      # PluginHost validates JWTs against Keycloak (JWKS fetch at startup/first
      # request). Only start once Keycloak has imported the realm and is healthy.
      keycloak-server:
        condition: service_healthy
    networks:
      - pluginhost-internal
      - gaeco-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/80 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 50
    labels:
      # Marks this container as the Module Federation host for the Orchestrator.
      orchestrator.host: "true"
      orchestrator.apiKey: "${PLUGINHOST_SNAPSHOT_API_KEY}"

  pluginhost-client:
    image: ${IMAGE_REGISTRY}/pluginhost-client:${PLUGINHOST_CLIENT_TAG}
    ports:
      - "${PLUGINHOST_CLIENT_PORT}:80"
    environment:
      - VITE_HOST_API_URL=http://localhost:${PLUGINHOST_SERVER_PORT}
      - VITE_KEYCLOAK_URL=${KEYCLOAK_BROWSER_URL}
      - VITE_KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - VITE_KEYCLOAK_CLIENT_ID=${KEYCLOAK_PLUGINHOST_CLIENT_CLIENT_ID}
      - VITE_SIGNALR_PATH=/hub
      - VITE_SIGNALR_PLUGIN_EVENT=PluginChange
      - VITE_SIGNALR_OPERATION_ADD_PLUGIN=Add
    depends_on:
      pluginhost-server:
        condition: service_healthy
    networks:
      - gaeco-network

networks:
  pluginhost-internal:
  gaeco-network:
    name: gaeco-local
