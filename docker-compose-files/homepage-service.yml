# =============================================================================
# Homepage — start page / getting-started checklist (Microfrontend client only)
# =============================================================================
# Replaces the Plugin Host's built-in fallback start page. The plugin id must
# contain "homepage": the Plugin Host detects the start page plugin by substring
# match on the id and renders it at route "/".
#
# The checklist reads the live state of five services to show which setup steps
# are already satisfied. Every URL below is optional — an unset one only
# degrades the matching step to "status unknown", it does not break the page.
# =============================================================================
services:
  homepage-client:
    image: ${IMAGE_REGISTRY}/homepage-client:${HOMEPAGE_CLIENT_TAG}
    ports:
      - "${HOMEPAGE_CLIENT_PORT}:80"
    environment:
      VITE_MOUNT_PATH: ${HOMEPAGE_MOUNT_ROUTE}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_HOMEPAGE_CLIENT_ID}
      # Probed for the per-step status. Reached from the browser, so localhost.
      VITE_GUIDELINE_API_URL: http://localhost:${GUIDELINE_SERVER_PORT}
      VITE_ONTOLOGY_API_URL: http://localhost:${ONTOLOGY_SERVER_PORT}
      VITE_USECASE_API_URL: http://localhost:${USECASE_SERVER_PORT}
      VITE_ACCESS_API_URL: http://localhost:${ACCESS_SERVER_PORT}
      VITE_INSTANCE_API_URL: http://localhost:${INSTANCE_SERVER_PORT}
      # Where each step links to — must match the module's own mount route.
      VITE_PLATFORMCONFIG_ROUTE: ${PLATFORMCONFIG_MOUNT_ROUTE}
      VITE_USECASE_ROUTE: ${USECASE_MOUNT_ROUTE}
      VITE_ACCESS_ROUTE: ${ACCESS_MOUNT_ROUTE}
      VITE_INSTANCE_ROUTE: ${INSTANCE_MOUNT_ROUTE}
      # Demo data hint — this is a local deployment, so it is on.
      VITE_ENABLE_DEMO_DATA: ${HOMEPAGE_ENABLE_DEMO_DATA}
    networks:
      - gaeco-network
    labels:
      app.mfe.id: "app-homepage"
      app.mfe.displayName: "Homepage Client"
      app.mfe.description: "Homepage Client Application"
      app.mfe.iconPath: "/homepage.svg"
      app.mfe.entrypointPath: "/assets/remoteEntry.js"
      app.mfe.exposedModule: "App"
      app.mfe.route: "${HOMEPAGE_MOUNT_ROUTE}"

networks:
  gaeco-network:
    name: gaeco-local
