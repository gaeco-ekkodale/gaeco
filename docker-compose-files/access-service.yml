# =============================================================================
# AccessService — role-based access control (RBAC) (+ MFE client)
# =============================================================================
services:
  access-postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${ACCESS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ACCESS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ACCESS_POSTGRES_DATABASE}
    ports:
      - "${ACCESS_POSTGRES_PORT}:5432"
    volumes:
      - type: bind
        source: ${VOLUME_BASE_PATH}/access/postgres/
        target: /var/lib/postgresql/data
    networks:
      - access-internal
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-d", "${ACCESS_POSTGRES_DATABASE}", "-U", "${ACCESS_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 30s

  access-server:
    image: ${IMAGE_REGISTRY}/access-server:${ACCESS_SERVER_TAG}
    ports:
      - "${ACCESS_SERVER_PORT}:80"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Postgres__Host: access-postgres
      Postgres__Port: 5432
      Postgres__User: ${ACCESS_POSTGRES_USER}
      Postgres__Password: ${ACCESS_POSTGRES_PASSWORD}
      Postgres__Database: ${ACCESS_POSTGRES_DATABASE}
      Keycloak__ServerUrl: ${KEYCLOAK_BACKEND_URL}
      Keycloak__Realm: ${KEYCLOAK_REALM}
      Keycloak__ClientId: ${KEYCLOAK_ACCESS_CLIENT_ID}
      Keycloak__ClientSecret: ${KEYCLOAK_ACCESS_CLIENT_SECRET}
      Kafka__Address: ${KAFKA_ADDRESS}
      Kafka__ConsumerGroup: ${KAFKA_CONSUMER_GROUP_ACCESS}
      Kafka__AutoOffsetReset: ${KAFKA_AUTO_OFFSET_RESET}
      Kafka__SessionTimeoutMs: ${KAFKA_SESSION_TIMEOUT_MS}
      Kafka__MaxPollIntervalMs: ${KAFKA_MAX_POLL_INTERVAL_MS}
      Kafka__Topics__AccessRights: ${KAFKA_TOPICS_ACCESSRIGHTS}
      Kafka__Topics__Usergroups: ${KAFKA_TOPICS_USERGROUPS}
      Kafka__Topics__Guidelines: ${KAFKA_TOPICS_GUIDELINES}
      Kafka__Topics__UseCaseGuidelines: ${KAFKA_TOPICS_USECASEGUIDELINES}
      GuidelineService__Address: http://guideline-server:80
      Minio__Address: ${MINIO_ADDRESS}
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__OntologyBucket: ${MINIO_ONTOLOGY_BUCKET}
      OpenTelemetry__OtlpEndpoint: ${OTLP_ENDPOINT}
      UseCaseGuideline__BucketName: ${USECASEGUIDELINE_BUCKET_NAME}
    depends_on:
      access-postgres:
        condition: service_healthy
      # Waits for Keycloak (JWT validation / JWKS at startup).
      keycloak-server:
        condition: service_healthy
    networks:
      - access-internal
      - gaeco-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/80 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 50

  access-client:
    image: ${IMAGE_REGISTRY}/access-client:${ACCESS_CLIENT_TAG}
    ports:
      - "${ACCESS_CLIENT_PORT}:80"
    environment:
      VITE_ACCESS_SERVICE_API_URL: http://localhost:${ACCESS_SERVER_PORT}
      VITE_GUIDELINE_SERVICE_API_URL: http://localhost:${GUIDELINE_SERVER_PORT}
      VITE_USECASE_SERVICE_API_URL: http://localhost:${USECASE_SERVER_PORT}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_ACCESS_CLIENT_ID}
      VITE_ADMIN_ROLE_NAME: ${ACCESS_CLIENT_ADMIN_ROLE_NAME}
      VITE_MOUNT_PATH: ${ACCESS_MOUNT_ROUTE}
    depends_on:
      access-server:
        condition: service_healthy
    networks:
      - gaeco-network
    labels:
      app.mfe.id: "app-access"
      app.mfe.displayName: "Access-Rights"
      app.mfe.description: "Access Client Application"
      app.mfe.iconPath: "/Access.svg"
      app.mfe.entrypointPath: "/assets/remoteEntry.js"
      app.mfe.exposedModule: "App"
      app.mfe.route: "${ACCESS_MOUNT_ROUTE}"

networks:
  access-internal:
  gaeco-network:
    name: gaeco-local
