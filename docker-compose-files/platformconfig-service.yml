# =============================================================================
# PlatformConfig — platform-wide settings (Microfrontend client only)
# =============================================================================
services:
  platformconfig-client:
    image: ${IMAGE_REGISTRY}/platformconfig-client:${PLATFORMCONFIG_CLIENT_TAG}
    ports:
      - "${PLATFORMCONFIG_CLIENT_PORT}:80"
    environment:
      VITE_MOUNT_PATH: ${PLATFORMCONFIG_MOUNT_ROUTE}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_PLATFORMCONFIG_CLIENT_ID}
      VITE_GUIDELINE_API_URL: http://localhost:${GUIDELINE_SERVER_PORT}
      VITE_ONTOLOGY_API_URL: http://localhost:${ONTOLOGY_SERVER_PORT}
    networks:
      - gaeco-network
    labels:
      app.mfe.id: "app-platformconfig"
      app.mfe.displayName: "Platform-Config"
      app.mfe.description: "PlatformConfig Client Application"
      app.mfe.iconPath: "/platform-config.svg"
      app.mfe.entrypointPath: "/assets/remoteEntry.js"
      app.mfe.exposedModule: "App"
      app.mfe.route: "${PLATFORMCONFIG_MOUNT_ROUTE}"

networks:
  gaeco-network:
    name: gaeco-local
