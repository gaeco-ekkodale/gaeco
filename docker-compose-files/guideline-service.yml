# =============================================================================
# GuidelineService — data guidelines, taxonomies, metadata standards
# =============================================================================
services:
  guideline-postgres:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${GUIDELINE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GUIDELINE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${GUIDELINE_POSTGRES_DATABASE}
    ports:
      - "${GUIDELINE_POSTGRES_PORT}:5432"
    volumes:
      - type: bind
        source: ${VOLUME_BASE_PATH}/guideline/postgres/
        target: /var/lib/postgresql/data
    networks:
      - guideline-internal
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-d", "${GUIDELINE_POSTGRES_DATABASE}", "-U", "${GUIDELINE_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 30s

  guideline-server:
    image: ${IMAGE_REGISTRY}/guideline-server:${GUIDELINE_SERVER_TAG}
    restart: always
    ports:
      - "${GUIDELINE_SERVER_PORT}:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Postgres__Host=guideline-postgres
      - Postgres__Port=5432
      - Postgres__User=${GUIDELINE_POSTGRES_USER}
      - Postgres__Password=${GUIDELINE_POSTGRES_PASSWORD}
      - Postgres__Database=${GUIDELINE_POSTGRES_DATABASE}
      - Kafka__Address=${KAFKA_ADDRESS}
      - Kafka__UploadedGuidelineTopic=${KAFKA_UPLOADED_GUIDELINE_TOPIC}
      - Minio__Address=${MINIO_ADDRESS}
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - OpenTelemetry__OtlpEndpoint=${OTLP_ENDPOINT}
      - Keycloak__ServerUrl=${KEYCLOAK_BACKEND_URL}
      - Keycloak__Realm=${KEYCLOAK_REALM}
      - Keycloak__Authority=${KEYCLOAK_BROWSER_URL}/realms/${KEYCLOAK_REALM}
      - AllowedCorsOrigins__ServerUrl=${ALLOWED_CORS_ORIGIN}
    volumes:
      - type: bind
        source: ${VOLUME_BASE_PATH}/guideline/data
        target: /app/Assets
    depends_on:
      guideline-postgres:
        condition: service_healthy
      # Waits for Keycloak (JWT validation / JWKS at startup).
      keycloak-server:
        condition: service_healthy
    networks:
      - guideline-internal
      - gaeco-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/80 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 50

networks:
  guideline-internal:
  gaeco-network:
    name: gaeco-local
